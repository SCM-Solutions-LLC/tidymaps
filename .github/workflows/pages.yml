name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      # Both suites gate the deploy. Only the unit tests used to, so a change
      # that broke an end-to-end path still shipped to production — and the
      # e2e suite is the one that covers the wizard, the 3D viewer, and the
      # saved-space writes, which is where the user-visible breakage lives.
      - name: Run regression tests
        run: node --test tests/*.test.mjs
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npx playwright test
      - name: Check product links
        run: npm run check:links
        continue-on-error: true
      # Publishing the working tree uploaded node_modules, tests, docs and
      # migrations alongside the 11MB site — a 168MB artifact for what a
      # visitor's browser actually fetches. scripts/build-site.sh copies only
      # what the site references; tests/deploy-artifact.test.mjs runs the same
      # script, so a change to either is checked against the other.
      - name: Build the deploy artifact
        run: bash scripts/build-site.sh _site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
