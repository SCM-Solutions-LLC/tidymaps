name: Tests
on:
  pull_request:
  workflow_dispatch:
# Neither job writes anything through GITHUB_TOKEN — checkout, install,
# lint/typecheck/test. Least-privilege default rather than whatever the
# repo's own token settings happen to be.
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      # Runs before the suite: a lint failure is usually a typo'd name or a
      # binding nothing reads, and those are quicker to read here than as a
      # test failure three screens down.
      - name: Lint
        run: npm run lint
      # Scoped to the data layer — see the note in jsconfig.json for what is
      # checked, what is not, and why the screen files are not worth it yet.
      - name: Type check
        run: npm run check:types
      - name: Unit and contract tests
        run: node --test tests/*.test.mjs
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E wizard matrix
        run: npx playwright test
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
