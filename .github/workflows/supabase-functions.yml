name: Deploy edge functions

# Nothing deployed the edge functions. The site shipped to Pages on every merge
# to main, and the functions it talks to were whatever someone last pushed by
# hand — which is how the analyze-space prompt sat seven days behind main while
# four merged PRs' server-side work stayed dormant in production. The client
# half of a change went live and the server half did not, and no check anywhere
# could see the difference.
#
# So the same merge that publishes the site publishes the functions.
#
# Requires a SUPABASE_ACCESS_TOKEN repository secret (Supabase dashboard →
# Account → Access Tokens). The project ref is not a secret: it is already in
# js/config.js and in every request the browser makes.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-functions.yml'
  # Weekly, so drift introduced outside this workflow — a dashboard edit, a
  # local `supabase functions deploy` — heals on its own instead of waiting to
  # be discovered. Deploying what main already says is a no-op when nothing
  # drifted.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # A missing token must fail loudly. Skipping the deploy on a missing
      # secret would recreate the exact silence this workflow exists to end:
      # a green run that deployed nothing.
      - name: Check the access token is configured
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set, so the edge functions cannot be deployed."
            echo "::error::Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # The shared modules under supabase/functions/_shared are imported by the
      # functions AND by the Node suite, so a break there is a break in both.
      # Deploying a function whose validator rejects every plan is worse than
      # not deploying, and this is the only gate between a merge and production.
      - name: Run the tests that cover the shared modules
        run: node --test tests/*.test.mjs

      # The command lives in package.json so a deploy from a laptop and a deploy
      # from CI are the same command. --use-api bundles server-side, so neither
      # needs a Docker daemon.
      # verify_jwt is NOT passed as a flag: supabase/config.toml declares it per
      # function, and passing it here would let the flag and the file disagree —
      # the drift that put analyze-space and render-after on false while
      # track-events and get-shared-space went true, with nothing recording it.
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npm run deploy:functions

      # Deploy reports success per function; this proves the project agrees.
      # `--prune` is deliberately not used above, so a function that exists
      # remotely and not in the repo is left alone rather than deleted — this
      # step surfaces that case instead of acting on it.
      - name: List what the project now has
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx supabase functions list --project-ref jwubrtaacveavbkosgtf
